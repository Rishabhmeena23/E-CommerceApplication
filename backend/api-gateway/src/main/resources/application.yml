server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: auth-service-users
              uri: http://localhost:8081
              predicates:
                - Path=/users/**

            - id: admin-service
              uri: http://localhost:8085
              predicates:
                - Path=/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
jwt:
  secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyForJwtSigning123456789}