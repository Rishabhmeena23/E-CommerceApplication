server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Rushi@1999
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.ecommerce.productservice: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: "*"

