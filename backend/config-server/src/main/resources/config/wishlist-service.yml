server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${WISHLIST_DB_USERNAME:root}
    password: ${WISHLIST_DB_PASSWORD:rishabh2506}
