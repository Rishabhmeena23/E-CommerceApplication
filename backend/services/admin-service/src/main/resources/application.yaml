server:
  port: 8085

spring:
  application:
    name: admin-service

  config:
    import: optional:configserver:http://localhost:8888

services:
  auth:
    url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyForJwtSigning123456789}