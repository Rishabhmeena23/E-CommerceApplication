server:
  port: 8081

spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:http://localhost:8888

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-32+char-secret!}
  expiration: ${JWT_EXPIRATION:86400000}

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY:change-me-in-production}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true