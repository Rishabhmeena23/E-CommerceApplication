spring:
  application:
    name: seller-service

  config:
    import: configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-32+char-secret!}
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
internal:
  service:
    key: ${INTERNAL_SERVICE_KEY:change-me-in-production}
